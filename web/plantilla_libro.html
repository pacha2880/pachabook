<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pachabook</title>
  <meta name="description" content="Lee en línea Programación Competitiva Universitaria: 112 consejos para dominar la ICPC, de Rodrigo Salguero.">
  <meta property="og:title" content="Programación Competitiva Universitaria · Leer en línea">
  <meta property="og:description" content="112 consejos para dominar la ICPC, por Rodrigo Salguero.">
  <meta property="og:image" content="https://pacha2880.github.io/pachabook/web/miniatura.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="112 consejos para la ICPC">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23042550'/><g font-family='Arial Narrow,Arial,sans-serif' font-size='15' font-weight='700' fill='%23fddd46' text-anchor='middle'><text x='16' y='14.5'>28</text><text x='16' y='28.5'>80</text></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #042550;
      --amarillo: #fddd46;
      --amarillo-suave: #fff6c9;
      --crema: #f7f4ec;
      --papel: #fffdf8;
      --tinta: #16203a;
      --tinta-suave: #4f5873;
      --linea: #e2dccb;
      --enlace: #0b4aa2;
      --titulos: "Barlow Condensed", "Arial Narrow", sans-serif;
      --texto: "Source Serif 4", Georgia, serif;
      --barra: 60px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--barra) + 16px); }
    body {
      margin: 0;
      background: var(--crema);
      color: var(--tinta);
      font-family: var(--texto);
      font-size: 1.125rem;
      line-height: 1.7;
    }
    a { color: var(--enlace); }

    /* ---------- Barra superior ---------- */
    .barra {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--barra);
      background: var(--azul);
      color: #fff;
    }
    .barra-dentro {                   /* mismo ancho que el contenido */
      max-width: 1180px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
    }
    .barra .marca {
      color: #fff;
      text-decoration: none;
      font: 700 1.3rem/1.1 var(--titulos);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .barra .marca span { color: var(--amarillo); }
    .boton {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 600 1rem/1 var(--titulos);
      letter-spacing: .06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 4px;
      border: 2px solid var(--amarillo);
      background: var(--amarillo);
      color: var(--tinta);
      cursor: pointer;
      white-space: nowrap;
    }
    .boton svg { width: 18px; height: 18px; }
    .boton-indice { display: none; background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
    .boton:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .progreso {
      position: absolute;
      left: 0; bottom: 0;
      height: 3px;
      width: 0;
      background: var(--amarillo);
    }

    /* ---------- Estructura ---------- */
    .marco {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      max-width: 1180px;
      margin: 0 auto;
      gap: 48px;
      padding: 0 20px;
    }
    nav.indice {
      position: sticky;
      top: var(--barra);
      align-self: start;
      max-height: calc(100vh - var(--barra));
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--linea) transparent;
      padding: 32px 0;
      font: 500 1.08rem/1.3 var(--titulos);
    }
    nav.indice .rotulo {
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .9rem;
      color: var(--tinta-suave);
      margin: 0 0 12px 12px;
    }
    nav.indice ol { list-style: none; margin: 0; padding: 0; }
    nav.indice ol ol { margin: 2px 0 6px 12px; font-size: .98rem; }
    nav.indice a {
      display: block;
      padding: 6px 12px;
      border-left: 3px solid transparent;
      color: var(--tinta);
      text-decoration: none;
      border-radius: 0 4px 4px 0;
    }
    nav.indice a:hover { background: rgba(4, 37, 80, .06); }
    nav.indice a.activo { border-left-color: var(--amarillo); background: rgba(4, 37, 80, .07); font-weight: 700; }

    main {
      background: var(--papel);
      border-left: 1px solid var(--linea);
      border-right: 1px solid var(--linea);
      padding: 24px 56px 80px;
      min-width: 0;
    }
    main section { max-width: 68ch; }
    main section + section { border-top: 1px solid var(--linea); margin-top: 56px; }

    h2 {
      font: 700 clamp(2rem, 4vw, 2.6rem)/1.1 var(--titulos);
      margin: 56px 0 24px;
    }
    h2::before {
      content: "";
      display: block;
      width: 48px;
      height: 5px;
      background: var(--amarillo);
      margin-bottom: 16px;
    }
    h3 {
      font: 700 1.6rem/1.2 var(--titulos);
      margin: 48px 0 16px;
      color: var(--azul);
    }
    p { margin: 0 0 1.1em; }
    .firma {
      text-align: right;
      font: 600 1.1rem/1.45 var(--titulos);
      letter-spacing: .03em;
      color: var(--tinta-suave);
      margin-top: 32px;
    }

    /* Epígrafe (antes de la presentación, como en el libro impreso) */
    .epigrafe {
      max-width: 68ch;
      margin: 48px 0 0;
      padding: 8px 0 8px 24px;
      border-left: 4px solid var(--amarillo);
    }
    .epigrafe blockquote { margin: 0; }
    .epigrafe p { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.4; }
    .epigrafe figcaption {
      font: 600 1.1rem/1.3 var(--titulos);
      letter-spacing: .04em;
      color: var(--tinta-suave);
    }

    /* Consejos */
    ol.consejos { list-style: none; margin: 0 0 32px; padding: 0; }
    ol.consejos li {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 4px 14px;
      align-items: start;
      padding: 14px 16px;
      margin: 0 -16px;
      border-radius: 6px;
      transition: background .3s;
      cursor: pointer;                       /* tocar cualquier parte del recuadro lo selecciona */
      -webkit-tap-highlight-color: transparent;
    }
    ol.consejos li + li { border-top: 1px dashed var(--linea); }
    ol.consejos .num {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      height: 36px;
      min-width: 36px;
      padding: 0 6px;
      border-radius: 18px;
      background: var(--azul);
      color: var(--amarillo);
      font: 700 1.1rem/1 var(--titulos);
      text-decoration: none;
      margin-top: 2px;
    }
    ol.consejos .num:hover { background: #0b3268; }
    /* Se marca con una clase (no :target) para poder seleccionar sin mover la página */
    ol.consejos li.seleccionado { background: var(--amarillo-suave); }
    /* "Compartir": solo en el consejo seleccionado, debajo del texto a la derecha, gris tenue, sin fondo */
    .compartir-consejo {
      grid-column: 2;
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0 -4px -6px 0;
      padding: 3px 4px;
      border: 0;
      background: none;
      color: #8a8a8a;
      font: 600 .9rem var(--titulos);
      letter-spacing: .03em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: aparecer .3s;
    }
    .compartir-consejo:hover { color: var(--tinta-suave); }
    .compartir-consejo:focus-visible { outline: 2px solid var(--enlace); outline-offset: 2px; border-radius: 4px; }
    .compartir-consejo svg { width: 16px; height: 16px; }
    .compartir-consejo .hecho, .compartir-consejo.copiado .icono { display: none; }
    .compartir-consejo.copiado .hecho { display: block; }
    .compartir-consejo.copiado { color: #3a8a4a; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    .ref-consejo { font-weight: 600; }
    .cita { text-decoration: none; font-size: .9em; }

    ul.bonus { padding-left: 1.2em; }
    ul.bonus li { margin-bottom: .6em; }
    ul.bonus li::marker { color: #c9a400; }

    figure { margin: 32px 0; }
    figure img { width: 100%; height: auto; border: 1px solid var(--linea); border-radius: 4px; background: #fff; }
    figcaption { font-size: .9rem; color: var(--tinta-suave); margin-top: 8px; word-break: break-word; }

    ol.referencias { padding-left: 2.2em; font-size: 1rem; }
    ol.referencias li { margin-bottom: .9em; word-break: break-word; }
    ol.referencias li:target { background: var(--amarillo-suave); }


    /* ---------- Celular y tablet ---------- */
    @media (max-width: 900px) {
      .marco { grid-template-columns: 1fr; padding: 0; gap: 0; }
      .boton-indice { display: inline-flex; }
      .barra-dentro { gap: 12px; padding: 0 12px; }
      .barra .marca { font-size: 1.05rem; line-height: 1.1; white-space: normal; }
      .barra .marca span { display: block; }
      nav.indice {
        position: fixed;
        top: var(--barra);
        left: 0; right: 0;
        max-height: calc(100vh - var(--barra));
        background: var(--crema);
        box-shadow: 0 12px 24px rgba(0,0,0,.18);
        padding: 20px 12px;
        z-index: 9;
        display: none;
      }
      nav.indice.abierto { display: block; }
      main { border: 0; padding: 8px 20px 64px; }
      ol.consejos li { grid-template-columns: 40px 1fr; gap: 4px 10px; margin: 0 -8px; padding: 12px 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      ol.consejos li { transition: none; }
      .compartir-consejo { animation: none; }
    }
  </style>
</head>
<body>

  <header class="barra">
    <div class="barra-dentro">
      <button class="boton boton-indice" id="boton-indice" type="button" aria-expanded="false" aria-controls="indice">Índice</button>
      <a class="marca" href="./">Programación Competitiva <span>Universitaria</span></a>
      <a class="boton boton-descarga" href="pachabook.pdf" title="Ver el libro en PDF">PDF</a>
    </div>
    <div class="progreso" id="progreso"></div>
  </header>

  <div class="marco">
    <nav class="indice" id="indice" aria-label="Índice del libro">
      <p class="rotulo">Índice</p>
{{INDICE}}
    </nav>

    <main>
{{CONTENIDO}}
    </main>
  </div>

  <script>
    (function () {
      var nav = document.getElementById("indice");
      var boton = document.getElementById("boton-indice");
      var progreso = document.getElementById("progreso");

      // Índice desplegable en celular
      boton.addEventListener("click", function () {
        var abierto = nav.classList.toggle("abierto");
        boton.setAttribute("aria-expanded", abierto);
      });
      nav.addEventListener("click", function (e) {
        if (e.target.tagName === "A") {
          nav.classList.remove("abierto");
          boton.setAttribute("aria-expanded", "false");
        }
      });

      // Resaltar en el índice la sección que se está leyendo
      var enlaces = {};
      nav.querySelectorAll("a").forEach(function (a) { enlaces[a.getAttribute("href").slice(1)] = a; });
      var titulos = Array.prototype.slice.call(document.querySelectorAll("main h2, main h3"))
        .map(function (h) { return h.tagName === "H2" ? h.parentElement : h; });
      function actualizar() {
        var limite = window.innerHeight * 0.3, actual = null;
        titulos.forEach(function (el) {
          if (el.getBoundingClientRect().top < limite) actual = el;
        });
        Object.keys(enlaces).forEach(function (k) { enlaces[k].classList.remove("activo"); });
        if (actual && enlaces[actual.id]) enlaces[actual.id].classList.add("activo");

        var total = document.documentElement.scrollHeight - window.innerHeight;
        progreso.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + "%";
      }
      window.addEventListener("scroll", actualizar, { passive: true });
      actualizar();

      // Al abrir un enlace a un consejo (#consejo-N), volver a ubicarlo cuando
      // terminen de cargar las fuentes, que cambian la altura del texto.
      if (location.hash && document.fonts) {
        document.fonts.ready.then(function () {
          var destino = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (destino) destino.scrollIntoView({ behavior: "instant" });
        });
      }

      // Compartir el consejo seleccionado (#consejo-N), igual que en la portada:
      // en pantallas táctiles abre el menú del sistema; en computadora copia.
      var compartir = document.createElement("button");
      compartir.type = "button";
      compartir.className = "compartir-consejo";
      compartir.innerHTML =
        '<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>' +
        '<svg class="hecho" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' +
        '<span class="etiqueta">Compartir</span>';
      var etiqueta = compartir.querySelector(".etiqueta");
      var seleccionado = null, espera = null;

      function seleccionar(li) {
        if (seleccionado) seleccionado.classList.remove("seleccionado");
        seleccionado = li;
        if (!li) { compartir.remove(); return; }
        li.classList.add("seleccionado");
        clearTimeout(espera);
        compartir.classList.remove("copiado");
        etiqueta.textContent = "Compartir";
        compartir.setAttribute("aria-label", "Compartir el consejo " + li.id.slice(8));
        li.appendChild(compartir);
      }
      function seleccionarDesdeHash() {
        var id = decodeURIComponent(location.hash.slice(1));
        seleccionar(/^consejo-\d+$/.test(id) ? document.getElementById(id) : null);
      }
      // Los enlaces "consejo 56" del texto sí llevan al consejo (cambian el hash)
      window.addEventListener("hashchange", seleccionarDesdeHash);
      seleccionarDesdeHash();

      // Tocar cualquier parte del recuadro (o su número) lo selecciona sin mover
      // la página: se cambia la URL con replaceState, que no hace scroll.
      document.querySelectorAll("ol.consejos li").forEach(function (li) {
        li.addEventListener("click", function (e) {
          var enlace = e.target.closest("a");
          if (enlace && !enlace.classList.contains("num")) return;   // enlaces del texto: normal
          if (e.target.closest(".compartir-consejo")) return;
          if (String(window.getSelection())) return;                  // estaba seleccionando texto
          e.preventDefault();
          history.replaceState(null, "", "#" + li.id);
          // Al pasar "Compartir" de un consejo a otro cambian sus alturas; se
          // corrige el scroll para que el consejo tocado quede quieto en pantalla.
          var antes = li.getBoundingClientRect().top;
          seleccionar(li);
          window.scrollBy({ top: li.getBoundingClientRect().top - antes, behavior: "instant" });
        });
      });

      // Tras copiar: ✓ verde y "¡Copiado!" un momento
      function avisar(texto) {
        compartir.classList.toggle("copiado", texto === "¡Copiado!");
        etiqueta.textContent = texto;
        compartir.setAttribute("aria-label", texto);
        clearTimeout(espera);
        espera = setTimeout(function () {
          compartir.classList.remove("copiado");
          etiqueta.textContent = "Compartir";
          if (seleccionado) compartir.setAttribute("aria-label", "Compartir el consejo " + seleccionado.id.slice(8));
        }, 1800);
      }
      function copiarViejo(texto) {             // para navegadores sin API de portapapeles
        var area = document.createElement("textarea");
        area.value = texto;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(area);
        avisar(ok ? "¡Copiado!" : "No se pudo copiar");
      }
      function copiar(texto) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(texto).then(
            function () { avisar("¡Copiado!"); },
            function () { copiarViejo(texto); });
        } else {
          copiarViejo(texto);
        }
      }

      compartir.addEventListener("click", function () {
        if (!seleccionado) return;
        var n = seleccionado.id.slice(8);
        var texto = seleccionado.querySelector("span").textContent.replace(/\s+/g, " ").trim();
        var url = location.href.split("#")[0] + "#consejo-" + n;
        var mensaje = "Consejo #" + n + ": " + texto;
        var tactil = window.matchMedia("(pointer: coarse)").matches;
        if (tactil && navigator.share) {
          navigator.share({ title: "Programación Competitiva Universitaria", text: mensaje, url: url })
            .catch(function (e) {
              if (!e || e.name !== "AbortError") copiar(mensaje + "\n" + url);  // AbortError = el usuario canceló
            });
        } else {
          copiar(mensaje + "\n" + url);
        }
      });
    })();
  </script>
</body>
</html>
