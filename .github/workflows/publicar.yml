# En cada push a main: compila los PDFs (completo y sin tapas), genera la web y la publica en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Compilar PDFs (completo y sin tapas)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            pachabook-sin-tapas.tex
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode
          post_compile: mv main.pdf pachabook.pdf

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generar web
        run: |
          pip install pillow
          python web/generar_web.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
